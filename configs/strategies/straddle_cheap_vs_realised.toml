# Existing idea 2, rerun through the harness (V-16): buy the straddle when implied volatility is
# below trailing realised volatility. Score = -(implied / realised); the threshold keeps ratios under 1.
name = "straddle_cheap_vs_realised"
family = "stock_long_straddle"

book = "stock"
structure = "long_straddle"
decision_time = "evening"
entry_time = "next_open"

[expiry]
min_dte = 7

[strikes]
max_snap_pct = 2.5

[exit]
max_hold_sessions = 5
safety_days = 3

[liquidity]
min_volume = 50
min_open_interest = 20
min_premium = 5.0

[score]
source = "feature"
feature = "iv_rv_ratio"
sign = -1.0
threshold = -1.0

[selection]
weekly_cap = true
max_per_day = 1
